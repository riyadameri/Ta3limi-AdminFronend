<!-- nav-bar.component.html -->
<div class="sidebar" [class.mobile-open]="isMobile">
    <!-- زر إغلاق للجوال -->
    <div class="mobile-close-btn" (click)="closeSidebar()" *ngIf="isMobile">
        <i class="bi bi-x-lg"></i>
    </div>
    
    <!-- معلومات المستخدم المدمجة -->
    <div class="user-info-compact">
        <img [src]="userAvatar" [alt]="userName" class="user-avatar">
        <div class="user-details">
            <p class="user-name">{{ userName }}</p>
            <small class="user-role">{{ userRole }}</small>
        </div>
        <i class="bi bi-chevron-left toggle-icon" (click)="toggleCollapsed()" *ngIf="!isMobile"></i>
    </div>

    <!-- قائمة التنقل الرئيسية -->
    <div class="nav-menu">
        <ul class="nav-list">
            <li class="nav-item" *ngFor="let item of menuItems">
                <a class="nav-link" 
                   [class.active]="activeSection === item.id"
                   (click)="navigateTo(item.route, item.id)"
                   [title]="item.label">
                    <div class="nav-icon">
                        <i class="bi {{ item.icon }}"></i>
                        <span class="notification-badge" *ngIf="item.notification">{{ item.notification }}</span>
                    </div>
                    <span class="nav-label" [class.collapsed]="collapsed">{{ item.label }}</span>
                    <i class="bi bi-chevron-left arrow" *ngIf="item.subItems"></i>
                </a>
                
                <!-- القوائم الفرعية -->
                <ul class="sub-menu" *ngIf="item.subItems">
                    <li *ngFor="let subItem of item.subItems">
                        <a (click)="navigateTo(subItem.route, item.id)">{{ subItem.label }}</a>
                    </li>
                </ul>
            </li>
        </ul>
    </div>

    <!-- زر تسجيل الخروج -->
    <div class="logout-section">
        <a class="logout-btn" (click)="logout()">
            <i class="bi bi-box-arrow-left"></i>
            <span [class.collapsed]="collapsed">تسجيل الخروج</span>
        </a>
    </div>

    <!-- نسخة الشعار المصغرة -->
    <div class="mini-logo" *ngIf="collapsed && !isMobile">
        <i class="bi bi-building"></i>
    </div>
</div>

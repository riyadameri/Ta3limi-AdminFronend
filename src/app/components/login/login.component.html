<div class="login-page-wrapper" dir="rtl">
  <!-- خلفيات زخرفية -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <!-- البطاقة الرئيسية -->
  <div class="login-card-container">
    <!-- القسم الأيسر - العلامة التجارية -->
    <div class="login-visual">
      <div class="visual-content">
        <span class="greeting-tag">{{ getGreeting() }}</span>
        <h1>مدرسة الرواد</h1>
        <p>نظام الإدارة الموحد للمؤسسات التعليمية</p>
        <div class="visual-icon">
          <i class="fas fa-user-shield"></i>
        </div>
      </div>
    </div>

    <!-- القسم الأيمن - نموذج تسجيل الدخول -->
    <div class="login-form-area">
      <div class="form-header">
        <h2>تسجيل الدخول</h2>
        <p>مرحباً بك مجدداً! يرجى إدخال بياناتك</p>
      </div>

      <form (ngSubmit)="login()" #loginForm="ngForm">
        <!-- مفتاح المدرسة -->
        <div class="input-group-custom">
          <label for="schoolKey">🔑 مفتاح المدرسة <span class="required">*</span></label>
          <div class="input-wrapper">
            <i class="fas fa-school icon-prefix"></i>
            <input 
              type="text" 
              id="schoolKey" 
              name="schoolKey" 
              [(ngModel)]="schoolKey" 
              placeholder="أدخل مفتاح المدرسة"
              (keypress)="onSchoolKeyPress($event)"
              required>
          </div>
          <small class="hint">مثال: SCH-XXXXX-XXXXX</small>
        </div>

        <!-- اسم المستخدم -->
        <div class="input-group-custom">
          <label for="username">👤 اسم المستخدم <span class="required">*</span></label>
          <div class="input-wrapper">
            <i class="fas fa-user icon-prefix"></i>
            <input 
              type="text" 
              id="username" 
              name="username" 
              [(ngModel)]="username" 
              placeholder="أدخل اسم المستخدم"
              (keypress)="onUsernameKeyPress($event)"
              required>
          </div>
        </div>

        <!-- كلمة المرور -->
        <div class="input-group-custom">
          <div class="label-row">
            <label for="password">🔒 كلمة المرور <span class="required">*</span></label>
            <a href="javascript:void(0)" (click)="forgotPassword()" class="forgot-link">نسيت كلمة المرور؟</a>
          </div>
          <div class="input-wrapper">
            <i class="fas fa-lock icon-prefix"></i>
            <input 
              [type]="passwordFieldType" 
              id="password" 
              name="password" 
              [(ngModel)]="password" 
              placeholder="••••••••"
              (keypress)="onPasswordKeyPress($event)"
              required>
            <i class="fas" 
               [class.fa-eye]="passwordFieldType === 'password'" 
               [class.fa-eye-slash]="passwordFieldType === 'text'"
               (click)="togglePasswordVisibility()" 
               class="icon-suffix"></i>
          </div>
        </div>

        <!-- خيارات إضافية -->
        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe">
            <span class="checkmark"></span>
            تذكرني
          </label>
        </div>

        <!-- رسالة الخطأ -->
        <div *ngIf="errorMessage" class="error-message">
          <i class="fas fa-exclamation-circle"></i>
          {{ errorMessage }}
        </div>

        <!-- أزرار الإجراء -->
        <div class="action-buttons">
          <button type="submit" class="btn-primary" [disabled]="isLoading || !isFormValid()">
            <span *ngIf="!isLoading">🚀 دخول للنظام</span>
            <span *ngIf="isLoading" class="loader-dots">⏳ جاري التحميل</span>
          </button>
          
          <button type="button" class="btn-outline" (click)="redirectToAccountingInterface()" [disabled]="isLoading || !isFormValid()">
            <i class="fas fa-calculator"></i> واجهة المحاسبة
          </button>
        </div>
      </form>

      <!-- التذييل -->
      <footer class="form-footer">
        <p>&copy; {{ currentYear }} مدرسة الرواد. جميع الحقوق محفوظة.</p>
      </footer>
    </div>
  </div>
</div>
